name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "target/urlshortener-0.0.1-SNAPSHOT.jar"
          target: "~/"
          strip_components: 1

      - name: Restart app on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo lsof -ti:8080 | xargs sudo kill -9 || true
            nohup java -jar ~/urlshortener-0.0.1-SNAPSHOT.jar --spring.config.additional-location=file:/home/ec2-user/application.properties > ~/app.log 2>&1 &

      - name: Health check
        run: |
          sleep 25
          curl --fail -X POST http://${{ secrets.EC2_HOST }}:8080/api/shorten \
            -H "Content-Type: application/json" \
            -d '{"url": "https://example.com"}'